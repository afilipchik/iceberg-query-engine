[package]
name = "query_engine"
version = "0.1.0"
edition = "2021"
authors = ["Query Engine Team"]
description = "High-performance SQL query engine for Apache Iceberg"
license = "Apache-2.0"
# The MSRV-aware dependency resolver. Required by the optional `lance` feature:
# lance-io depends on aws-config unconditionally, and the newest aws-* releases
# declare rust-version 1.94.1 while this toolchain is 1.93.0. Resolver 3 reads
# `rust-version` below and picks the newest aws-* that this compiler accepts
# (aws-config 1.8.18 etc.) instead of failing the build. It is a no-op for the
# default feature set — see the Cargo.lock note in CLAUDE.md.
rust-version = "1.93.0"
resolver = "3"

[dependencies]
# SQL Parsing
sqlparser = "0.52"

# Arrow ecosystem
arrow = { version = "58", features = ["ffi", "chrono-tz", "prettyprint"] }
arrow-array = "58"
arrow-schema = "58"
arrow-select = "58"
arrow-ord = "58"
arrow-cast = "58"
parquet = { version = "58", features = ["async"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Concurrency
crossbeam = "0.8"
libc = "0.2"
num_cpus = "1.16"

# Utilities
chrono = "0.4"
rust_decimal = { version = "1", features = ["serde"] }
ordered-float = "5"
hashbrown = "0.17"
parking_lot = "0.12"
rayon = "1"
num-traits = "0.2"
itertools = "0.15"
rand = "0.8"  # HELD BACK: rand 0.9+ changed sampling algorithms; the TPC-H generator must stay byte-deterministic (data<->CSV/fixture coupling)
bytes = "1"
regex = "1"
base64 = "0.23"
data-encoding = "2"
md-5 = "0.11"
sha1 = "0.11"
sha2 = "0.11"
url = "2"
uuid = { version = "1", features = ["v4"] }
hex = "0.4"
percent-encoding = "2"
crc32fast = "1"
xxhash-rust = { version = "0.8", features = ["xxh64"] }
hmac = "0.13"
unicode-normalization = "0.1"
statrs = "0.19"
rust-stemmers = "1.2"

# HTTP Client (for metastore)
reqwest = { version = "0.13", features = ["json"] }

# Avro, for Iceberg manifest lists and manifest files (src/storage/iceberg.rs).
# Arrow-independent: this cannot move the arrow-53 pin the Lance feature needs.
# Default features only — Iceberg manifests use the null and deflate codecs,
# both supported without optional codec features.
apache-avro = "0.22"

# HTTP server for `query_engine serve` (src/distributed/). Deliberately hyper +
# arrow-ipc rather than tonic/arrow-flight: all three crates below are ALREADY
# in Cargo.lock (pulled in under `--features lance` via object_store/aws-sdk),
# so naming them here adds ZERO new lock entries and cannot move the arrow-53
# pin that Lance requires. `http1`+`server` only — the `http2` feature would
# pull h2 into the default build for no benefit. See
# .claude/plans/DISTRIBUTED-DESIGN.md "Flight semantics, not the Flight crate".
hyper = { version = "1", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body-util = "0.1"

# Arrow Flight endpoint (src/distributed/flight.rs) — AMENDMENT 2026-08-21 to
# the note above: the "no tonic/arrow-flight" ruling was about the INTERNAL
# shuffle/fragment transport, which stays on hyper + arrow-ipc. This is the
# CLIENT-FACING endpoint (`serve --flight-bind`), and arrow-flight tracks
# arrow majors: the 53.x line builds against exactly the arrow 53 pin Lance
# requires, so the risk the ruling guarded against does not arise. Verified on
# addition: the Cargo.lock diff was ADD-ONLY (no existing crate moved). tonic
# runs its own hyper/h2 stack; our direct hyper dependency keeps http1-only.
arrow-flight = "58"
tonic = "0.14"
# TcpListenerStream for the flight server's incoming socket stream. Already in
# the lock as tonic's own dependency, so naming it adds no lock entries.
tokio-stream = { version = "0.1", features = ["net"] }

# CLI
clap = { version = "4", features = ["derive"] }
rustyline = { version = "17", features = ["with-fuzzy"] }
dirs-next = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
mimalloc = "0.1.52"
memmap2 = "0.9.11"

# Lance columnar format (OPTIONAL — see [features] below).
# Pinned to 0.23.x on purpose: 0.23 is the last line that builds against
# arrow 53, the same arrow major this engine uses, so Lance's RecordBatch IS
# our RecordBatch and no IPC/FFI bridge is needed. lance 0.25+/10.x require
# arrow 54/55/58 and would fork the arrow version in-tree. Do not bump.
# Building this feature also needs `protoc` on PATH or in $PROTOC
# (lance-table's build script compiles .proto files).
lance = { version = "10", default-features = false, optional = true }
# Already in the tree as transitive dependencies of lance 0.23.2 — naming them
# here adds no compilation, only the direct import paths the WRITE path needs:
# `DatasetIndexExt`/`IndexType` for create_index, and `MetricType` for the
# index's distance function. lance re-exports neither. Same pin, same reason.
lance-index = { version = "10", optional = true }
lance-linalg = { version = "10", optional = true }

# Apache Pulsar integration (OPTIONAL — see [features]). Topics-as-tables:
# the admin REST API is the catalog (discovery, schema registry, bounded-read
# watermarks) and the WebSocket reader API delivers the messages. The native
# pulsar-rs client was REJECTED: 6.8 requires chrono >= 0.4.41, which is
# incompatible with the arrow-53 pin (newer chrono breaks arrow-arith 53.x) —
# the resolver downgraded arrow chasing it. tungstenite is a small sync
# WebSocket client whose tree stays inside the existing lock families.
tungstenite = { version = "0.30", optional = true, default-features = false, features = [
    "handshake",
] }

# GPU offload (OPTIONAL — see [features]). cudarc is pure Rust over the CUDA
# driver API + NVRTC: kernels are CUDA C strings compiled AT RUNTIME by
# libnvrtc, so there is no nvcc, no build script, no bindgen. dynamic-loading
# dlopens libcuda/libnvrtc at first use — a `--features gpu` binary still
# runs (and cleanly reports no GPU) on machines without a driver.
cudarc = { version = "0.19", optional = true, default-features = false, features = [
    "std",
    "driver",
    "nvrtc",
    "dynamic-loading",
    # Driver 580.x implements the CUDA 13.0 driver API.
    "cuda-13000",
] }

[features]
default = []
# Enables the Lance table provider (src/storage/lance.rs), the Lance writer
# (src/storage/lance_write.rs), the `load-lance` / `benchmark-lance` /
# `write-lance` / `lance-versions` / `create-lance-index` CLI commands, and the
# REPL `.lance` / `.lance-versions` / `.tpch-lance` dot commands. Off by default
# so the ~490-crate Lance tree (incl. DataFusion) is never compiled — and never
# able to perturb — the default benchmark build.
lance = ["dep:lance", "dep:lance-index", "dep:lance-linalg"]
# GPU-resident aggregate offload (src/physical/gpu/). Off by default: the
# default build has zero CUDA surface. Needs an NVIDIA driver at runtime.
gpu = ["dep:cudarc"]
# Pulsar topics as tables (src/storage/pulsar.rs): serve --pulsar-*, REPL
# .pulsar. Off by default; needs a reachable broker at runtime.
pulsar = ["dep:tungstenite"]

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
tempfile = "3"
pretty_assertions = "1"
csv = "1"

[[bin]]
name = "query_engine"
path = "src/main.rs"

[[bench]]
name = "tpch"
harness = false

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
debug = false

[profile.bench]
lto = true
codegen-units = 1
opt-level = 3
