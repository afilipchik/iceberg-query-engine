[package]
name = "query_engine"
version = "0.1.0"
edition = "2021"
authors = ["Query Engine Team"]
description = "High-performance SQL query engine for Apache Iceberg"
license = "Apache-2.0"
# The MSRV-aware dependency resolver. Required by the optional `lance` feature:
# lance-io depends on aws-config unconditionally, and the newest aws-* releases
# declare rust-version 1.94.1 while this toolchain is 1.93.0. Resolver 3 reads
# `rust-version` below and picks the newest aws-* that this compiler accepts
# (aws-config 1.8.18 etc.) instead of failing the build. It is a no-op for the
# default feature set — see the Cargo.lock note in CLAUDE.md.
rust-version = "1.93.0"
resolver = "3"

[dependencies]
# SQL Parsing
sqlparser = "0.52"

# Arrow ecosystem
arrow = { version = "53", features = ["ffi", "chrono-tz", "prettyprint"] }
arrow-array = "53"
arrow-schema = "53"
arrow-select = "53"
arrow-ord = "53"
arrow-cast = "53"
parquet = { version = "53", features = ["async"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "1.0"
anyhow = "1"

# Concurrency
crossbeam = "0.8"
libc = "0.2"
num_cpus = "1.16"

# Utilities
chrono = "0.4"
rust_decimal = { version = "1", features = ["serde"] }
ordered-float = "4"
hashbrown = "0.14"
parking_lot = "0.12"
rayon = "1"
num-traits = "0.2"
itertools = "0.13"
rand = "0.8"
bytes = "1"
regex = "1"
base64 = "0.21"
data-encoding = "2"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
url = "2"
uuid = { version = "1", features = ["v4"] }
hex = "0.4"
percent-encoding = "2"
crc32fast = "1"
xxhash-rust = { version = "0.8", features = ["xxh64"] }
hmac = "0.12"
unicode-normalization = "0.1"
statrs = "0.17"
rust-stemmers = "1.2"

# HTTP Client (for metastore)
reqwest = { version = "0.11", features = ["json"] }

# CLI
clap = { version = "4", features = ["derive"] }
rustyline = { version = "14", features = ["with-fuzzy"] }
dirs-next = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
mimalloc = "0.1.52"
memmap2 = "0.9.11"

# Lance columnar format (OPTIONAL — see [features] below).
# Pinned to 0.23.x on purpose: 0.23 is the last line that builds against
# arrow 53, the same arrow major this engine uses, so Lance's RecordBatch IS
# our RecordBatch and no IPC/FFI bridge is needed. lance 0.25+/10.x require
# arrow 54/55/58 and would fork the arrow version in-tree. Do not bump.
# Building this feature also needs `protoc` on PATH or in $PROTOC
# (lance-table's build script compiles .proto files).
lance = { version = "0.23", default-features = false, optional = true }
# Already in the tree as transitive dependencies of lance 0.23.2 — naming them
# here adds no compilation, only the direct import paths the WRITE path needs:
# `DatasetIndexExt`/`IndexType` for create_index, and `MetricType` for the
# index's distance function. lance re-exports neither. Same pin, same reason.
lance-index = { version = "0.23", optional = true }
lance-linalg = { version = "0.23", optional = true }

[features]
default = []
# Enables the Lance table provider (src/storage/lance.rs), the Lance writer
# (src/storage/lance_write.rs), the `load-lance` / `benchmark-lance` /
# `write-lance` / `lance-versions` / `create-lance-index` CLI commands, and the
# REPL `.lance` / `.lance-versions` / `.tpch-lance` dot commands. Off by default
# so the ~490-crate Lance tree (incl. DataFusion) is never compiled — and never
# able to perturb — the default benchmark build.
lance = ["dep:lance", "dep:lance-index", "dep:lance-linalg"]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"
pretty_assertions = "1"
csv = "1"

[[bin]]
name = "query_engine"
path = "src/main.rs"

[[bench]]
name = "tpch"
harness = false

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
debug = false

[profile.bench]
lto = true
codegen-units = 1
opt-level = 3
